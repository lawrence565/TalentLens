<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TalentLens Design System v1.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
    <style>
      /* ── DESIGN TOKENS ─────────────────────────────────────────── */
      :root {
        --tl-brand-50: oklch(0.975 0.013 265);
        --tl-brand-100: oklch(0.938 0.037 265);
        --tl-brand-200: oklch(0.875 0.068 265);
        --tl-brand-300: oklch(0.76 0.108 265);
        --tl-brand-400: oklch(0.63 0.155 265);
        --tl-brand-500: oklch(0.508 0.2 265);
        --tl-brand-600: oklch(0.433 0.213 265);
        --tl-brand-700: oklch(0.352 0.192 265);
        --tl-brand-800: oklch(0.265 0.152 265);
        --tl-brand-900: oklch(0.188 0.098 265);

        --tl-accent-50: oklch(0.974 0.014 192);
        --tl-accent-100: oklch(0.934 0.04 192);
        --tl-accent-300: oklch(0.762 0.112 192);
        --tl-accent-500: oklch(0.613 0.153 192);
        --tl-accent-600: oklch(0.514 0.153 192);
        --tl-accent-700: oklch(0.418 0.128 192);

        --tl-high-50: oklch(0.974 0.014 18);
        --tl-high-100: oklch(0.936 0.042 18);
        --tl-high-200: oklch(0.878 0.075 18);
        --tl-high-500: oklch(0.562 0.208 18);
        --tl-high-700: oklch(0.388 0.163 18);

        --tl-med-50: oklch(0.978 0.013 72);
        --tl-med-100: oklch(0.946 0.042 72);
        --tl-med-200: oklch(0.888 0.075 72);
        --tl-med-500: oklch(0.715 0.158 72);
        --tl-med-700: oklch(0.514 0.148 72);

        --tl-low-50: oklch(0.974 0.014 158);
        --tl-low-100: oklch(0.935 0.042 158);
        --tl-low-200: oklch(0.872 0.075 158);
        --tl-low-500: oklch(0.622 0.15 158);
        --tl-low-600: oklch(0.526 0.14 158);
        --tl-low-700: oklch(0.438 0.128 158);

        --tl-n-50: oklch(0.987 0.004 95);
        --tl-n-100: oklch(0.962 0.007 85);
        --tl-n-200: oklch(0.916 0.01 80);
        --tl-n-300: oklch(0.844 0.01 75);
        --tl-n-400: oklch(0.718 0.009 265);
        --tl-n-500: oklch(0.583 0.01 265);
        --tl-n-600: oklch(0.472 0.01 265);
        --tl-n-700: oklch(0.364 0.01 265);
        --tl-n-800: oklch(0.258 0.009 265);
        --tl-n-900: oklch(0.174 0.008 265);

        --tl-surface: #ffffff;
        --tl-bg: oklch(0.987 0.004 95);
        --tl-border: oklch(0.916 0.01 80);
        --tl-border-strong: oklch(0.844 0.01 75);
        --tl-text: oklch(0.174 0.008 265);
        --tl-text-muted: oklch(0.472 0.01 265);
        --tl-text-subtle: oklch(0.583 0.01 265);

        --tl-font: "Plus Jakarta Sans", system-ui, sans-serif;
        --tl-mono: "JetBrains Mono", "Fira Code", monospace;

        --tl-shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.05);
        --tl-shadow-sm:
          0 2px 4px rgba(0, 0, 0, 0.07), 0 1px 2px rgba(0, 0, 0, 0.04);
        --tl-shadow-md:
          0 4px 12px rgba(0, 0, 0, 0.09), 0 2px 4px rgba(0, 0, 0, 0.04);
        --tl-shadow-lg:
          0 8px 24px rgba(0, 0, 0, 0.11), 0 4px 8px rgba(0, 0, 0, 0.04);
      }

      /* ── RESET + BASE ──────────────────────────────────────────── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: var(--tl-font);
        background: var(--tl-bg);
        color: var(--tl-text);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      /* ── LAYOUT ────────────────────────────────────────────────── */
      #ds-shell {
        display: flex;
        min-height: 100vh;
      }

      #ds-sidebar {
        width: 228px;
        flex-shrink: 0;
        background: var(--tl-n-900);
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        overflow-y: auto;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        z-index: 10;
      }
      #ds-sidebar::-webkit-scrollbar {
        width: 4px;
      }
      #ds-sidebar::-webkit-scrollbar-track {
        background: transparent;
      }
      #ds-sidebar::-webkit-scrollbar-thumb {
        background: oklch(0.28 0.008 265);
        border-radius: 2px;
      }

      #ds-main {
        margin-left: 228px;
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      #ds-topbar {
        position: sticky;
        top: 0;
        z-index: 5;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--tl-border);
        padding: 0 40px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      #ds-content {
        padding: 52px 56px 80px;
        max-width: 960px;
      }

      /* ── SIDEBAR NAV ────────────────────────────────────────────── */
      .sb-logo {
        padding: 20px 20px 18px;
        border-bottom: 1px solid oklch(0.22 0.008 265);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .sb-logo-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .sb-logo-text {
        font-family: var(--tl-font);
        font-weight: 800;
        font-size: 15px;
        color: white;
      }
      .sb-version {
        font-family: var(--tl-mono);
        font-size: 10px;
        color: oklch(0.42 0.01 265);
        margin-left: 2px;
      }

      .sb-group {
        padding: 18px 0 4px;
      }
      .sb-group-label {
        padding: 0 16px 8px;
        font-family: var(--tl-font);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: oklch(0.4 0.01 265);
      }
      .sb-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 16px;
        cursor: pointer;
        font-family: var(--tl-font);
        font-size: 13px;
        font-weight: 500;
        color: oklch(0.6 0.01 265);
        border: none;
        background: none;
        width: 100%;
        text-align: left;
        border-radius: 0;
        transition:
          color 0.12s,
          background 0.12s;
        text-decoration: none;
      }
      .sb-item:hover {
        color: white;
        background: oklch(0.22 0.008 265);
      }
      .sb-item.active {
        color: white;
        background: var(--tl-brand-600);
        font-weight: 600;
      }
      .sb-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.5;
        flex-shrink: 0;
      }

      /* ── INTRO SECTION ──────────────────────────────────────────── */
      .intro-hero {
        padding: 40px 0 52px;
        border-bottom: 1px solid var(--tl-border);
        margin-bottom: 52px;
      }
      .intro-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--tl-brand-50);
        border: 1px solid var(--tl-brand-200);
        border-radius: 9999px;
        padding: 4px 12px;
        font-family: var(--tl-mono);
        font-size: 11px;
        font-weight: 500;
        color: var(--tl-brand-700);
        margin-bottom: 20px;
      }
      .intro-title {
        font-family: var(--tl-font);
        font-size: 40px;
        font-weight: 800;
        color: var(--tl-n-900);
        line-height: 1.1;
        margin-bottom: 16px;
        letter-spacing: -0.02em;
      }
      .intro-title span {
        color: var(--tl-brand-500);
      }
      .intro-desc {
        font-family: var(--tl-font);
        font-size: 16px;
        color: var(--tl-n-500);
        line-height: 1.7;
        max-width: 560px;
        margin-bottom: 32px;
      }

      /* ── BEFORE/AFTER ───────────────────────────────────────────── */
      .ba-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .ba-card {
        border-radius: 12px;
        padding: 20px;
        border: 1px solid var(--tl-border);
        background: white;
      }
      .ba-card.after {
        background: var(--tl-brand-50);
        border-color: var(--tl-brand-200);
      }
      .ba-label {
        font-family: var(--tl-font);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        margin-bottom: 14px;
      }
      .ba-label.before {
        color: var(--tl-n-400);
      }
      .ba-label.after {
        color: var(--tl-brand-600);
      }
      .ba-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 6px 0;
        border-bottom: 1px solid var(--tl-n-100);
        font-family: var(--tl-font);
        font-size: 13px;
        line-height: 1.5;
      }
      .ba-row:last-child {
        border-bottom: none;
      }
      .ba-icon {
        flex-shrink: 0;
        margin-top: 1px;
      }

      /* ── TOPBAR BREADCRUMB ──────────────────────────────────────── */
      .tb-breadcrumb {
        font-family: var(--tl-font);
        font-size: 13px;
        color: var(--tl-n-500);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .tb-sep {
        color: var(--tl-n-300);
      }
      .tb-current {
        color: var(--tl-n-800);
        font-weight: 600;
      }
      .tb-meta {
        font-family: var(--tl-mono);
        font-size: 11px;
        color: var(--tl-n-400);
        display: flex;
        align-items: center;
        gap: 12px;
      }

      /* ── ANIMATIONS ─────────────────────────────────────────────── */
      @keyframes tl-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes tl-fadein {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      #ds-content > section {
        animation: tl-fadein 0.3s ease both;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" src="ds-foundation.jsx"></script>
    <script type="text/babel" src="ds-components.jsx"></script>
    <script type="text/babel" src="ds-features.jsx"></script>
    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // ── NAVIGATION STRUCTURE ──────────────────────────────────────
      const NAV = [
        { group: "Introduction", items: [{ id: "intro", label: "Overview" }] },
        {
          group: "Foundation",
          items: [
            { id: "brand", label: "Brand & Identity" },
            { id: "colors", label: "Color System" },
            { id: "typography", label: "Typography" },
            { id: "spacing", label: "Spacing & Grid" },
          ],
        },
        {
          group: "Components",
          items: [
            { id: "buttons", label: "Buttons" },
            { id: "badges", label: "Badges & Tags" },
            { id: "cards", label: "Cards" },
            { id: "inputs", label: "Form Controls" },
          ],
        },
        {
          group: "Feature Components",
          items: [
            { id: "score", label: "Score Display" },
            { id: "upload", label: "Upload Zone" },
            { id: "issues", label: "Issue Item" },
            { id: "ats", label: "ATS Checks" },
            { id: "header", label: "Page Header" },
          ],
        },
        {
          group: "Fix Workspace",
          items: [
            { id: "fix-workspace", label: "Fix Task" },
          ],
        },
      ];

      // ── SIDEBAR ───────────────────────────────────────────────────
      const Sidebar = ({ active, onNav }) => (
        <nav id="ds-sidebar">
          <div className="sb-logo">
            <div className="sb-logo-row">
              <TLLogoMark size={32} />
              <div>
                <div className="sb-logo-text">TalentLens</div>
              </div>
            </div>
            <div className="sb-version">Design System · v1.0 · May 2026</div>
          </div>
          {NAV.map(({ group, items }) => (
            <div key={group} className="sb-group">
              <div className="sb-group-label">{group}</div>
              {items.map(({ id, label }) => (
                <button
                  key={id}
                  className={`sb-item${active === id ? " active" : ""}`}
                  onClick={() => onNav(id)}
                >
                  <span className="sb-dot" />
                  {label}
                </button>
              ))}
            </div>
          ))}
        </nav>
      );

      // ── TOPBAR ────────────────────────────────────────────────────
      const Topbar = ({ active }) => {
        const labels = {
          intro: "Overview",
          brand: "Brand & Identity",
          colors: "Color System",
          typography: "Typography",
          spacing: "Spacing & Grid",
          buttons: "Buttons",
          badges: "Badges & Tags",
          cards: "Cards",
          inputs: "Form Controls",
          score: "Score Display",
          upload: "Upload Zone",
          issues: "Issue Item",
          ats: "ATS Checks",
          header: "Page Header",
          "fix-workspace": "Fix Task",
        };
        const group =
          NAV.find((g) => g.items.find((i) => i.id === active))?.group ||
          "Introduction";
        return (
          <div id="ds-topbar">
            <div className="tb-breadcrumb">
              <span>TalentLens DS</span>
              <span className="tb-sep">›</span>
              <span>{group}</span>
              <span className="tb-sep">›</span>
              <span className="tb-current">{labels[active] || active}</span>
            </div>
            <div className="tb-meta">
              <span>Plus Jakarta Sans · JetBrains Mono</span>
              <span>·</span>
              <span style={{ color: "var(--tl-brand-500)", fontWeight: 600 }}>
                Indigo + Teal
              </span>
            </div>
          </div>
        );
      };

      // ── INTRO SECTION ─────────────────────────────────────────────
      const IntroSection = () => (
        <section id="intro" style={{ paddingBottom: 72 }}>
          <div className="intro-hero">
            <div className="intro-badge">
              <svg width="10" height="10" viewBox="0 0 10 10">
                <circle cx="5" cy="5" r="5" fill="var(--tl-brand-500)" />
              </svg>
              v1.0 · May 2026 · React + TypeScript
            </div>
            <h1 className="intro-title">
              TalentLens
              <br />
              <span>Design System</span>
            </h1>
            <p className="intro-desc">
              A comprehensive design foundation for TalentLens — the AI resume
              diagnosis tool. This system covers brand identity, color tokens,
              typography, spacing, and all UI components from buttons to the
              full diagnosis report layout.
            </p>
            <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
              {[
                ["Color Tokens", "40+"],
                ["Components", "14"],
                ["Feature Patterns", "5"],
                ["Semantic Variants", "12"],
              ].map(([label, count]) => (
                <div
                  key={label}
                  style={{
                    background: "white",
                    border: "1px solid var(--tl-border)",
                    borderRadius: 10,
                    padding: "12px 20px",
                    textAlign: "center",
                  }}
                >
                  <div
                    style={{
                      fontFamily: "var(--tl-mono)",
                      fontSize: 22,
                      fontWeight: 500,
                      color: "var(--tl-brand-500)",
                      lineHeight: 1,
                    }}
                  >
                    {count}
                  </div>
                  <div
                    style={{
                      fontFamily: "var(--tl-font)",
                      fontSize: 11,
                      color: "var(--tl-n-500)",
                      marginTop: 4,
                    }}
                  >
                    {label}
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div style={{ marginBottom: 36 }}>
            <p
              style={{
                fontFamily: "var(--tl-font)",
                fontSize: 11,
                fontWeight: 700,
                letterSpacing: "0.07em",
                textTransform: "uppercase",
                color: "var(--tl-n-400)",
                marginBottom: 14,
              }}
            >
              Current Design · What We're Improving
            </p>
            <div className="ba-grid">
              <div className="ba-card">
                <div className="ba-label before">❌ Current State</div>
                {[
                  ['Generic "AI Resume Assistant" name — no brand identity'],
                  [
                    "Tailwind default blue (#3b82f6) — no brand differentiation",
                  ],
                  ["Inter only — no distinctive type personality"],
                  ["Raw score number — no visual context or scale"],
                  ["Plain text badges — severity not visually immediate"],
                  ["No left-border severity coding on issue cards"],
                  ["ATS check status = text only, no icon system"],
                  ["Upload zone — functional but no interaction states"],
                ].map(([text]) => (
                  <div key={text} className="ba-row">
                    <span
                      className="ba-icon"
                      style={{ color: "var(--tl-high-500)", fontSize: 12 }}
                    >
                      ✕
                    </span>
                    <span style={{ color: "var(--tl-n-600)" }}>{text}</span>
                  </div>
                ))}
              </div>
              <div className="ba-card after">
                <div className="ba-label after">✓ Design System v1.0</div>
                {[
                  ["TalentLens lens logomark + wordmark with sizing scale"],
                  [
                    "Deep indigo brand-500 + teal accent — distinctive AI identity",
                  ],
                  ["Plus Jakarta Sans 400–800 + JetBrains Mono for data"],
                  [
                    "Animated SVG score ring — fills from 0 with color semantics",
                  ],
                  [
                    "Severity badges with colored dot + semantic background tint",
                  ],
                  ["4px left-border on issue cards — instant severity scan"],
                  ["Pass/Warning/Fail with icon + color-coded ATS containers"],
                  [
                    "5-state upload zone: idle / drag / uploading / success / error",
                  ],
                ].map(([text]) => (
                  <div key={text} className="ba-row">
                    <span
                      className="ba-icon"
                      style={{ color: "var(--tl-low-500)", fontSize: 12 }}
                    >
                      ✓
                    </span>
                    <span style={{ color: "var(--tl-n-700)", fontWeight: 500 }}>
                      {text}
                    </span>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <div
            style={{
              background: "var(--tl-surface)",
              borderRadius: 14,
              border: "1px solid var(--tl-border)",
              padding: 28,
            }}
          >
            <p
              style={{
                fontFamily: "var(--tl-font)",
                fontSize: 11,
                fontWeight: 700,
                letterSpacing: "0.07em",
                textTransform: "uppercase",
                color: "var(--tl-n-400)",
                marginBottom: 16,
              }}
            >
              Technology Stack
            </p>
            <div
              style={{
                display: "grid",
                gridTemplateColumns: "repeat(3,1fr)",
                gap: 14,
              }}
            >
              {[
                {
                  label: "Frontend Framework",
                  value: "React 19 + TypeScript",
                  note: "Vite build tool",
                },
                {
                  label: "CSS Framework",
                  value: "Tailwind CSS v4",
                  note: "@theme custom tokens",
                },
                {
                  label: "Design Tokens",
                  value: "CSS Custom Properties",
                  note: "oklch color space",
                },
                {
                  label: "Primary Font",
                  value: "Plus Jakarta Sans",
                  note: "Google Fonts — weights 400–800",
                },
                {
                  label: "Data Font",
                  value: "JetBrains Mono",
                  note: "Scores, progress, labels",
                },
                {
                  label: "Icon System",
                  value: "Inline SVG",
                  note: "Stroke-based, 16–24px",
                },
              ].map(({ label, value, note }) => (
                <div
                  key={label}
                  style={{
                    padding: 16,
                    background: "var(--tl-n-50)",
                    borderRadius: 10,
                    border: "1px solid var(--tl-n-200)",
                  }}
                >
                  <div
                    style={{
                      fontFamily: "var(--tl-font)",
                      fontSize: 11,
                      color: "var(--tl-n-400)",
                      marginBottom: 4,
                      textTransform: "uppercase",
                      letterSpacing: "0.06em",
                      fontWeight: 700,
                    }}
                  >
                    {label}
                  </div>
                  <div
                    style={{
                      fontFamily: "var(--tl-font)",
                      fontSize: 13,
                      fontWeight: 700,
                      color: "var(--tl-n-900)",
                    }}
                  >
                    {value}
                  </div>
                  <div
                    style={{
                      fontFamily: "var(--tl-mono)",
                      fontSize: 11,
                      color: "var(--tl-n-500)",
                      marginTop: 2,
                    }}
                  >
                    {note}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );

      // ── SECTION ROUTER ────────────────────────────────────────────
      const SECTION_MAP = {
        intro: () => <IntroSection />,
        brand: () => <BrandSection />,
        colors: () => <ColorSection />,
        typography: () => <TypographySection />,
        spacing: () => <SpacingSection />,
        buttons: () => <ButtonSection />,
        badges: () => <BadgeSection />,
        cards: () => <CardSection />,
        inputs: () => <InputSection />,
        score: () => <ScoreSection />,
        upload: () => <UploadSection />,
        issues: () => <IssueSection />,
        ats: () => <ATSSection />,
        header: () => <HeaderSection />,
        "fix-workspace": () => <ResumeFixWorkspaceSection />,
      };

      // ── APP ────────────────────────────────────────────────────────
      const App = () => {
        const [active, setActive] = useState("intro");
        const [key, setKey] = useState(0);

        const handleNav = (id) => {
          setActive(id);
          setKey((k) => k + 1);
          document.getElementById("ds-content")?.scrollTo({ top: 0 });
        };

        return (
          <div id="ds-shell">
            <Sidebar active={active} onNav={handleNav} />
            <div id="ds-main">
              <Topbar active={active} />
              <div id="ds-content" key={key}>
                {(SECTION_MAP[active] || (() => <IntroSection />))()}
              </div>
            </div>
          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
