<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume Fix Workspace · TalentLens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
    <style>
      /* ── DESIGN TOKENS ────────────────────────────────────────── */
      :root {
        --tl-brand-500: oklch(0.508 0.2 265);
        --tl-brand-50: oklch(0.975 0.013 265);
        --tl-brand-100: oklch(0.938 0.037 265);
        --tl-brand-200: oklch(0.875 0.068 265);
        --tl-brand-600: oklch(0.433 0.213 265);
        --tl-brand-700: oklch(0.352 0.192 265);
        --tl-brand-900: oklch(0.188 0.098 265);
        --tl-high-50: oklch(0.974 0.014 18);
        --tl-high-100: oklch(0.936 0.042 18);
        --tl-high-500: oklch(0.562 0.208 18);
        --tl-med-50: oklch(0.978 0.013 72);
        --tl-med-100: oklch(0.946 0.042 72);
        --tl-med-500: oklch(0.715 0.158 72);
        --tl-low-50: oklch(0.974 0.014 158);
        --tl-low-100: oklch(0.935 0.042 158);
        --tl-low-500: oklch(0.622 0.15 158);
        --tl-n-50: oklch(0.987 0.004 95);
        --tl-n-100: oklch(0.962 0.007 85);
        --tl-n-200: oklch(0.916 0.01 80);
        --tl-n-300: oklch(0.844 0.01 75);
        --tl-n-400: oklch(0.718 0.009 265);
        --tl-n-500: oklch(0.583 0.01 265);
        --tl-n-600: oklch(0.472 0.01 265);
        --tl-n-700: oklch(0.364 0.01 265);
        --tl-n-800: oklch(0.258 0.009 265);
        --tl-n-900: oklch(0.174 0.008 265);
        --tl-surface: #ffffff;
        --tl-bg: oklch(0.987 0.004 95);
        --tl-border: oklch(0.916 0.01 80);
        --tl-border-strong: oklch(0.844 0.01 75);
        --tl-text: oklch(0.174 0.008 265);
        --tl-text-muted: oklch(0.472 0.01 265);
        --tl-text-subtle: oklch(0.583 0.01 265);
        --tl-font: "Plus Jakarta Sans", system-ui, sans-serif;
        --tl-mono: "JetBrains Mono", "Fira Code", monospace;
        --tl-shadow-sm: 0 2px 4px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
        --tl-shadow-md: 0 4px 12px rgba(0,0,0,0.09), 0 2px 4px rgba(0,0,0,0.04);
      }

      /* ── RESET + BASE ─────────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { font-size: 16px; }
      body {
        font-family: var(--tl-font);
        background: var(--tl-bg);
        color: var(--tl-text);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }
      #root { min-height: 100vh; display: flex; flex-direction: column; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useCallback, useRef } = React;

      /* ── SAMPLE DATA ──────────────────────────────────────────── */
      const INITIAL_ISSUES = [
        {
          id: "issue-quantified-impact",
          priority: 1,
          severity: "high",
          category: "Content Clarity",
          title: "Missing quantified achievements",
          affectedSection: "Work Experience · Product Operations Manager",
          reason: "Six bullets describe responsibilities but show no scope, outcome, or measurable impact.",
          originalText: "Managed weekly support operations and helped improve team workflow.",
          suggestions: [
            { id: "rewrite-impact", label: "Outcome-driven", text: "Led weekly support operations for a 9-person team, reducing unresolved ticket backlog by 23% over one quarter." },
            { id: "rewrite-ats", label: "ATS-friendly", text: "Managed support operations, workflow optimization, ticket triage, and cross-functional process improvements for a 9-person team." }
          ],
          status: "open"
        },
        {
          id: "issue-keyword-gap",
          priority: 2,
          severity: "medium",
          category: "Keywords",
          title: "Skills section lacks target-role keywords",
          affectedSection: "Skills",
          reason: "The skills list misses common product operations terms used in target roles.",
          originalText: "Operations, reporting, communication, support.",
          suggestions: [
            { id: "rewrite-keywords", label: "Role-aligned", text: "Product operations, ticket triage, workflow automation, KPI reporting, stakeholder communication, process improvement." }
          ],
          status: "open"
        },
        {
          id: "issue-summary",
          priority: 3,
          severity: "low",
          category: "Missing Sections",
          title: "No recruiter-facing summary",
          affectedSection: "Top of resume",
          reason: "The resume starts with work history and does not quickly frame role, domain, and value.",
          originalText: "",
          suggestions: [
            { id: "rewrite-summary", label: "Concise summary", text: "Product operations specialist with 5 years of experience improving support workflows, reporting systems, and cross-functional execution for SaaS teams." }
          ],
          status: "open"
        }
      ];

      /* ── HELPERS ──────────────────────────────────────────────── */
      function severityColor(sev) {
        if (sev === "high") return "var(--tl-high-500)";
        if (sev === "medium") return "var(--tl-med-500)";
        return "var(--tl-low-500)";
      }
      function severityBg(sev) {
        if (sev === "high") return "var(--tl-high-50)";
        if (sev === "medium") return "var(--tl-med-50)";
        return "var(--tl-low-50)";
      }
      function severityLabel(sev) {
        if (sev === "high") return "High";
        if (sev === "medium") return "Medium";
        return "Low";
      }

      /* ── SVG SCORE RING ───────────────────────────────────────── */
      function ScoreRing({ score, size = 80, strokeWidth = 7 }) {
        const r = (size - strokeWidth * 2) / 2;
        const circumference = 2 * Math.PI * r;
        const progress = score / 100;
        const dashOffset = circumference * (1 - progress);
        const cx = size / 2;
        const cy = size / 2;

        return (
          <svg width={size} height={size} style={{ flexShrink: 0 }}>
            <circle
              cx={cx} cy={cy} r={r}
              fill="none"
              stroke="var(--tl-n-200)"
              strokeWidth={strokeWidth}
            />
            <circle
              cx={cx} cy={cy} r={r}
              fill="none"
              stroke="var(--tl-brand-500)"
              strokeWidth={strokeWidth}
              strokeDasharray={circumference}
              strokeDashoffset={dashOffset}
              strokeLinecap="round"
              transform={`rotate(-90 ${cx} ${cy})`}
              style={{ transition: "stroke-dashoffset 0.6s ease" }}
            />
            <text
              x={cx} y={cy}
              textAnchor="middle"
              dominantBaseline="central"
              style={{
                fontFamily: "var(--tl-font)",
                fontWeight: 700,
                fontSize: size * 0.22,
                fill: "var(--tl-text)"
              }}
            >
              {score}
            </text>
          </svg>
        );
      }

      /* ── TOP NAV ──────────────────────────────────────────────── */
      function TopNav() {
        return (
          <header style={{
            position: "sticky",
            top: 0,
            zIndex: 100,
            height: 56,
            background: "var(--tl-surface)",
            borderBottom: "1px solid var(--tl-border)",
            boxShadow: "var(--tl-shadow-sm)",
            display: "flex",
            alignItems: "center",
            padding: "0 24px",
            gap: 16
          }}>
            {/* Logo */}
            <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
              <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                <circle cx="12" cy="12" r="9" stroke="var(--tl-brand-500)" strokeWidth="2.5" fill="var(--tl-brand-50)" />
                <circle cx="16" cy="16" r="6" stroke="var(--tl-brand-600)" strokeWidth="2" fill="none" />
                <line x1="20.5" y1="20.5" x2="25" y2="25" stroke="var(--tl-brand-700)" strokeWidth="2.5" strokeLinecap="round" />
              </svg>
              <span style={{
                fontWeight: 800,
                fontSize: 15,
                color: "var(--tl-brand-700)",
                letterSpacing: "-0.3px"
              }}>TalentLens</span>
            </div>

            {/* Breadcrumb */}
            <nav style={{
              flex: 1,
              display: "flex",
              justifyContent: "center",
              alignItems: "center",
              gap: 6,
              fontSize: 13,
              color: "var(--tl-text-muted)"
            }}>
              <a href="#" style={{ color: "var(--tl-brand-600)", textDecoration: "none", fontWeight: 500 }}>Dashboard</a>
              <span style={{ color: "var(--tl-n-300)" }}>›</span>
              <a href="#" style={{ color: "var(--tl-brand-600)", textDecoration: "none", fontWeight: 500 }}>General Resume</a>
              <span style={{ color: "var(--tl-n-300)" }}>›</span>
              <span style={{ color: "var(--tl-text)", fontWeight: 600 }}>Fix Workspace</span>
            </nav>

            {/* Right actions */}
            <div style={{ display: "flex", alignItems: "center", gap: 12, flexShrink: 0 }}>
              <button style={{
                background: "var(--tl-brand-500)",
                color: "#fff",
                border: "none",
                borderRadius: 8,
                padding: "7px 16px",
                fontSize: 13,
                fontWeight: 600,
                fontFamily: "var(--tl-font)",
                cursor: "pointer",
                letterSpacing: "-0.1px"
              }}>
                Save & Export
              </button>
              <div style={{
                width: 34,
                height: 34,
                borderRadius: "50%",
                background: "var(--tl-brand-100)",
                border: "2px solid var(--tl-brand-200)",
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                fontWeight: 700,
                fontSize: 13,
                color: "var(--tl-brand-700)",
                flexShrink: 0,
                cursor: "pointer"
              }}>
                SC
              </div>
            </div>
          </header>
        );
      }

      /* ── SCORE SUMMARY CARD ───────────────────────────────────── */
      function ScoreSummaryCard({ score, total, handled }) {
        const remaining = total - handled;
        return (
          <div style={{
            background: "var(--tl-surface)",
            border: "1px solid var(--tl-border)",
            borderRadius: 12,
            padding: "20px 24px",
            display: "flex",
            alignItems: "center",
            gap: 20,
            boxShadow: "var(--tl-shadow-sm)"
          }}>
            <ScoreRing score={score} size={80} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4, flexWrap: "wrap" }}>
                <h2 style={{ fontSize: 16, fontWeight: 700, letterSpacing: "-0.2px" }}>
                  Fixing your resume · {remaining} {remaining === 1 ? "issue" : "issues"} remaining
                </h2>
                <span style={{
                  background: "var(--tl-low-50)",
                  color: "var(--tl-low-500)",
                  border: "1px solid var(--tl-low-100)",
                  borderRadius: 99,
                  padding: "2px 9px",
                  fontSize: 11,
                  fontWeight: 600,
                  letterSpacing: "0.1px"
                }}>
                  ✓ ATS Readable
                </span>
              </div>
              <p style={{ fontSize: 13, color: "var(--tl-text-muted)" }}>
                Score {score}/100 · {remaining} {remaining === 1 ? "issue" : "issues"} to fix
                {handled > 0 && <span style={{ color: "var(--tl-low-500)", marginLeft: 8 }}>· {handled} resolved</span>}
              </p>
            </div>
            <a href="#" style={{
              fontSize: 12,
              color: "var(--tl-brand-600)",
              textDecoration: "none",
              fontWeight: 600,
              whiteSpace: "nowrap",
              flexShrink: 0
            }}>
              View full report →
            </a>
          </div>
        );
      }

      /* ── REWRITE SUGGESTION ───────────────────────────────────── */
      function RewriteSuggestion({ suggestion, selected, onSelect }) {
        return (
          <button
            onClick={() => onSelect(suggestion.id)}
            style={{
              width: "100%",
              textAlign: "left",
              background: selected ? "var(--tl-brand-50)" : "var(--tl-n-50)",
              border: selected ? "1.5px solid var(--tl-brand-500)" : "1.5px solid var(--tl-n-200)",
              borderRadius: 8,
              padding: "10px 14px",
              cursor: "pointer",
              transition: "all 0.15s ease",
              fontFamily: "var(--tl-font)"
            }}
          >
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
              <span style={{
                fontSize: 10,
                fontWeight: 700,
                fontFamily: "var(--tl-mono)",
                letterSpacing: "0.5px",
                textTransform: "uppercase",
                background: selected ? "var(--tl-brand-500)" : "var(--tl-n-300)",
                color: selected ? "#fff" : "var(--tl-text-muted)",
                borderRadius: 4,
                padding: "1px 6px"
              }}>
                {suggestion.label}
              </span>
              {selected && (
                <span style={{ fontSize: 11, color: "var(--tl-brand-600)", fontWeight: 600 }}>Selected</span>
              )}
            </div>
            <p style={{
              fontSize: 13,
              color: selected ? "var(--tl-text)" : "var(--tl-text-muted)",
              lineHeight: 1.55,
              margin: 0
            }}>
              {suggestion.text}
            </p>
          </button>
        );
      }

      /* ── BEFORE / AFTER DIFF ──────────────────────────────────── */
      function BeforeAfterDiff({ original, revised }) {
        return (
          <div style={{
            background: "var(--tl-n-50)",
            border: "1px solid var(--tl-border)",
            borderRadius: 8,
            overflow: "hidden",
            marginTop: 4
          }}>
            {original && (
              <div style={{
                padding: "10px 14px",
                borderBottom: "1px solid var(--tl-border)",
                background: "var(--tl-high-50)"
              }}>
                <span style={{
                  fontSize: 10,
                  fontFamily: "var(--tl-mono)",
                  fontWeight: 600,
                  color: "var(--tl-high-500)",
                  textTransform: "uppercase",
                  letterSpacing: "0.5px",
                  display: "block",
                  marginBottom: 4
                }}>Before</span>
                <p style={{ fontSize: 13, color: "var(--tl-text-muted)", lineHeight: 1.55, margin: 0, textDecoration: "line-through" }}>
                  {original}
                </p>
              </div>
            )}
            <div style={{ padding: "10px 14px", background: "var(--tl-low-50)" }}>
              <span style={{
                fontSize: 10,
                fontFamily: "var(--tl-mono)",
                fontWeight: 600,
                color: "var(--tl-low-500)",
                textTransform: "uppercase",
                letterSpacing: "0.5px",
                display: "block",
                marginBottom: 4
              }}>After</span>
              <p style={{ fontSize: 13, color: "var(--tl-text)", lineHeight: 1.55, margin: 0, fontWeight: 500 }}>
                {revised}
              </p>
            </div>
          </div>
        );
      }

      /* ── ISSUE TASK CARD ──────────────────────────────────────── */
      function IssueTaskCard({ issue, onApply, onDone }) {
        const [selectedId, setSelectedId] = useState(null);
        const [applied, setApplied] = useState(false);
        const [copied, setCopied] = useState(false);
        const [done, setDone] = useState(false);

        const selectedSuggestion = issue.suggestions.find(s => s.id === selectedId);
        const severityC = severityColor(issue.severity);
        const severityB = severityBg(issue.severity);

        function handleApply() {
          if (!selectedSuggestion) return;
          setApplied(true);
        }

        function handleCopy() {
          if (!selectedSuggestion) return;
          const text = selectedSuggestion.text;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
              setCopied(true);
              setTimeout(() => setCopied(false), 2000);
            }).catch(() => {
              setCopied(true);
              setTimeout(() => setCopied(false), 2000);
            });
          } else {
            setCopied(true);
            setTimeout(() => setCopied(false), 2000);
          }
        }

        function handleDone() {
          onApply(issue.id);
          setDone(true);
          setTimeout(() => onDone(issue.id), 300);
        }

        if (done) {
          return (
            <div style={{
              opacity: 0,
              transform: "translateY(-4px)",
              transition: "opacity 0.3s ease, transform 0.3s ease",
              pointerEvents: "none",
              height: 0,
              overflow: "hidden"
            }} />
          );
        }

        return (
          <div style={{
            background: "var(--tl-surface)",
            border: "1px solid var(--tl-border)",
            borderLeft: `4px solid ${severityC}`,
            borderRadius: 12,
            boxShadow: "var(--tl-shadow-sm)",
            overflow: "hidden"
          }}>
            {/* Card header */}
            <div style={{ padding: "16px 20px 14px" }}>
              <div style={{ display: "flex", alignItems: "flex-start", gap: 12, marginBottom: 8 }}>
                {/* Priority badge */}
                <div style={{
                  width: 26,
                  height: 26,
                  borderRadius: "50%",
                  background: "var(--tl-brand-500)",
                  color: "#fff",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  fontSize: 12,
                  fontWeight: 700,
                  flexShrink: 0,
                  marginTop: 1
                }}>
                  {issue.priority}
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", marginBottom: 3 }}>
                    <h3 style={{ fontSize: 14, fontWeight: 700, letterSpacing: "-0.1px" }}>
                      {issue.title}
                    </h3>
                    <span style={{
                      fontSize: 11,
                      fontWeight: 600,
                      background: severityB,
                      color: severityC,
                      borderRadius: 99,
                      padding: "2px 8px",
                      flexShrink: 0
                    }}>
                      {severityLabel(issue.severity)}
                    </span>
                  </div>
                  <p style={{
                    fontSize: 11,
                    fontFamily: "var(--tl-mono)",
                    color: "var(--tl-text-subtle)",
                    marginBottom: 6
                  }}>
                    {issue.affectedSection}
                  </p>
                  <p style={{ fontSize: 13, color: "var(--tl-text-muted)", lineHeight: 1.55 }}>
                    {issue.reason}
                  </p>
                </div>
              </div>

              {/* Original text blockquote */}
              {issue.originalText && !applied && (
                <div style={{
                  marginTop: 10,
                  marginLeft: 38,
                  padding: "8px 12px",
                  background: "var(--tl-n-50)",
                  borderLeft: "3px solid var(--tl-n-300)",
                  borderRadius: "0 6px 6px 0"
                }}>
                  <span style={{
                    fontSize: 10,
                    fontFamily: "var(--tl-mono)",
                    fontWeight: 600,
                    color: "var(--tl-text-subtle)",
                    textTransform: "uppercase",
                    letterSpacing: "0.5px",
                    display: "block",
                    marginBottom: 4
                  }}>Current text</span>
                  <p style={{ fontSize: 13, color: "var(--tl-text-muted)", fontStyle: "italic", lineHeight: 1.5, margin: 0 }}>
                    "{issue.originalText}"
                  </p>
                </div>
              )}
            </div>

            {/* Suggestion area */}
            {!applied && (
              <div style={{
                borderTop: "1px solid var(--tl-border)",
                padding: "14px 20px 14px",
                background: "var(--tl-n-50)"
              }}>
                <p style={{
                  fontSize: 11,
                  fontFamily: "var(--tl-mono)",
                  fontWeight: 600,
                  color: "var(--tl-n-400)",
                  textTransform: "uppercase",
                  letterSpacing: "0.5px",
                  marginBottom: 10
                }}>
                  AI Rewrites — select one
                </p>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {issue.suggestions.map(s => (
                    <RewriteSuggestion
                      key={s.id}
                      suggestion={s}
                      selected={selectedId === s.id}
                      onSelect={setSelectedId}
                    />
                  ))}
                </div>
              </div>
            )}

            {/* Applied diff view */}
            {applied && selectedSuggestion && (
              <div style={{
                borderTop: "1px solid var(--tl-border)",
                padding: "14px 20px"
              }}>
                <BeforeAfterDiff
                  original={issue.originalText}
                  revised={selectedSuggestion.text}
                />
              </div>
            )}

            {/* Action row */}
            <div style={{
              borderTop: "1px solid var(--tl-border)",
              padding: "12px 20px",
              display: "flex",
              alignItems: "center",
              gap: 8,
              background: "var(--tl-surface)"
            }}>
              {!applied ? (
                <button
                  onClick={handleApply}
                  disabled={!selectedId}
                  style={{
                    background: selectedId ? "var(--tl-brand-500)" : "var(--tl-n-200)",
                    color: selectedId ? "#fff" : "var(--tl-n-400)",
                    border: "none",
                    borderRadius: 7,
                    padding: "7px 16px",
                    fontSize: 13,
                    fontWeight: 600,
                    fontFamily: "var(--tl-font)",
                    cursor: selectedId ? "pointer" : "not-allowed",
                    transition: "background 0.15s ease, color 0.15s ease"
                  }}
                >
                  Apply rewrite
                </button>
              ) : (
                <button
                  onClick={handleCopy}
                  style={{
                    background: copied ? "var(--tl-low-50)" : "var(--tl-n-100)",
                    color: copied ? "var(--tl-low-500)" : "var(--tl-text-muted)",
                    border: `1px solid ${copied ? "var(--tl-low-100)" : "var(--tl-border)"}`,
                    borderRadius: 7,
                    padding: "7px 14px",
                    fontSize: 13,
                    fontWeight: 600,
                    fontFamily: "var(--tl-font)",
                    cursor: "pointer",
                    transition: "all 0.15s ease"
                  }}
                >
                  {copied ? "Copied!" : "Copy revised text"}
                </button>
              )}

              <button
                onClick={handleDone}
                style={{
                  background: "none",
                  color: applied ? "var(--tl-low-500)" : "var(--tl-text-subtle)",
                  border: `1px solid ${applied ? "var(--tl-low-100)" : "var(--tl-border)"}`,
                  borderRadius: 7,
                  padding: "7px 14px",
                  fontSize: 13,
                  fontWeight: 600,
                  fontFamily: "var(--tl-font)",
                  cursor: "pointer"
                }}
              >
                {applied ? "✓ Mark done" : "Skip this issue"}
              </button>

              {!applied && !selectedId && (
                <span style={{ fontSize: 12, color: "var(--tl-n-400)", marginLeft: 4 }}>
                  Select a rewrite to apply
                </span>
              )}
            </div>
          </div>
        );
      }

      /* ── ATS READINESS ────────────────────────────────────────── */
      function ATSReadiness() {
        const checks = [
          { label: "Parseable format", status: "pass" },
          { label: "Contact info present", status: "pass" },
          { label: "Keywords below threshold", status: "warn" }
        ];

        return (
          <div style={{
            background: "var(--tl-surface)",
            border: "1px solid var(--tl-border)",
            borderRadius: 12,
            padding: "16px 20px",
            marginTop: 16,
            boxShadow: "var(--tl-shadow-sm)"
          }}>
            <h3 style={{
              fontSize: 13,
              fontWeight: 700,
              marginBottom: 12,
              color: "var(--tl-text)"
            }}>ATS Readiness</h3>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {checks.map((c, i) => (
                <div key={i} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{
                    width: 18,
                    height: 18,
                    borderRadius: "50%",
                    background: c.status === "pass" ? "var(--tl-low-50)" : "var(--tl-med-50)",
                    border: `1.5px solid ${c.status === "pass" ? "var(--tl-low-100)" : "var(--tl-med-100)"}`,
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "center",
                    fontSize: 10,
                    fontWeight: 700,
                    color: c.status === "pass" ? "var(--tl-low-500)" : "var(--tl-med-500)",
                    flexShrink: 0
                  }}>
                    {c.status === "pass" ? "✓" : "△"}
                  </span>
                  <span style={{
                    fontSize: 13,
                    color: c.status === "pass" ? "var(--tl-text-muted)" : "var(--tl-med-500)",
                    fontWeight: c.status === "warn" ? 500 : 400
                  }}>
                    {c.label}
                  </span>
                </div>
              ))}
            </div>
            <a href="#" style={{
              display: "block",
              marginTop: 12,
              fontSize: 12,
              color: "var(--tl-brand-600)",
              textDecoration: "none",
              fontWeight: 600
            }}>
              Learn more about ATS compatibility →
            </a>
          </div>
        );
      }

      /* ── RIGHT SIDEBAR ────────────────────────────────────────── */
      function Sidebar({ issues, score, onSaveClick }) {
        const total = issues.length;
        const handled = issues.filter(i => i.status === "done" || i.status === "applied").length;
        const highRemaining = issues.filter(i => i.severity === "high" && i.status === "open").length;
        const progressPct = total > 0 ? Math.round((handled / total) * 100) : 0;
        const allHandled = handled === total;

        return (
          <aside style={{ width: 320, flexShrink: 0 }}>
            {/* Sticky progress panel */}
            <div style={{
              position: "sticky",
              top: 72,
              background: "var(--tl-surface)",
              border: "1px solid var(--tl-border)",
              borderRadius: 12,
              padding: "20px",
              boxShadow: "var(--tl-shadow-sm)"
            }}>
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center", marginBottom: 20 }}>
                <ScoreRing score={score} size={96} strokeWidth={8} />
                <p style={{ marginTop: 8, fontSize: 12, color: "var(--tl-text-subtle)", fontWeight: 500 }}>
                  Resume score
                </p>
              </div>

              {/* Stats row */}
              <div style={{
                display: "grid",
                gridTemplateColumns: "1fr 1fr 1fr",
                gap: 8,
                marginBottom: 16
              }}>
                {[
                  { label: "Found", value: total },
                  { label: "Resolved", value: handled, color: handled > 0 ? "var(--tl-low-500)" : undefined },
                  { label: "High priority", value: highRemaining, color: highRemaining > 0 ? "var(--tl-high-500)" : "var(--tl-low-500)" }
                ].map(s => (
                  <div key={s.label} style={{
                    textAlign: "center",
                    background: "var(--tl-n-50)",
                    borderRadius: 8,
                    padding: "10px 8px"
                  }}>
                    <div style={{
                      fontSize: 22,
                      fontWeight: 800,
                      color: s.color || "var(--tl-text)",
                      letterSpacing: "-0.5px",
                      lineHeight: 1
                    }}>
                      {s.value}
                    </div>
                    <div style={{ fontSize: 10, color: "var(--tl-text-subtle)", marginTop: 3, fontFamily: "var(--tl-mono)", letterSpacing: "0.3px" }}>
                      {s.label}
                    </div>
                  </div>
                ))}
              </div>

              {/* Progress bar */}
              <div style={{ marginBottom: 14 }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                  <span style={{ fontSize: 12, color: "var(--tl-text-muted)", fontWeight: 500 }}>Progress</span>
                  <span style={{ fontSize: 12, fontWeight: 700, color: progressPct === 100 ? "var(--tl-low-500)" : "var(--tl-brand-500)" }}>
                    {progressPct}%
                  </span>
                </div>
                <div style={{
                  height: 6,
                  background: "var(--tl-n-200)",
                  borderRadius: 99,
                  overflow: "hidden"
                }}>
                  <div style={{
                    height: "100%",
                    width: `${progressPct}%`,
                    background: progressPct === 100 ? "var(--tl-low-500)" : "var(--tl-brand-500)",
                    borderRadius: 99,
                    transition: "width 0.5s ease"
                  }} />
                </div>
              </div>

              {/* Guard copy */}
              {!allHandled && (
                <p style={{
                  fontSize: 12,
                  color: "var(--tl-text-subtle)",
                  textAlign: "center",
                  lineHeight: 1.5,
                  marginBottom: 14
                }}>
                  Fix remaining issues to unlock export and maximize your match rate.
                </p>
              )}

              {/* CTA */}
              <button
                onClick={onSaveClick}
                disabled={!allHandled}
                style={{
                  width: "100%",
                  background: allHandled ? "var(--tl-low-500)" : "var(--tl-n-200)",
                  color: allHandled ? "#fff" : "var(--tl-n-400)",
                  border: "none",
                  borderRadius: 8,
                  padding: "10px 0",
                  fontSize: 14,
                  fontWeight: 700,
                  fontFamily: "var(--tl-font)",
                  cursor: allHandled ? "pointer" : "not-allowed",
                  transition: "background 0.3s ease, color 0.3s ease"
                }}
              >
                {allHandled ? "Save Fixed Resume" : `Fix remaining issues (${total - handled})`}
              </button>
            </div>

            {/* ATS Readiness (non-sticky) */}
            <ATSReadiness />
          </aside>
        );
      }

      /* ── SAVE CONFIRMATION ────────────────────────────────────── */
      function SaveConfirmation({ onClose }) {
        return (
          <div style={{
            position: "fixed",
            inset: 0,
            background: "rgba(0,0,0,0.4)",
            zIndex: 1000,
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            padding: 24
          }}>
            <div style={{
              background: "var(--tl-surface)",
              borderRadius: 16,
              padding: "32px 36px",
              maxWidth: 420,
              width: "100%",
              textAlign: "center",
              boxShadow: "var(--tl-shadow-md)"
            }}>
              <div style={{
                width: 56,
                height: 56,
                borderRadius: "50%",
                background: "var(--tl-low-50)",
                border: "2px solid var(--tl-low-100)",
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                fontSize: 24,
                margin: "0 auto 16px"
              }}>
                ✓
              </div>
              <h2 style={{ fontSize: 18, fontWeight: 800, marginBottom: 8, letterSpacing: "-0.3px" }}>
                Resume saved!
              </h2>
              <p style={{ fontSize: 14, color: "var(--tl-text-muted)", marginBottom: 24, lineHeight: 1.6 }}>
                Your updated resume for Sarah Chen has been saved. All 3 issues have been addressed. You can now export a PDF or share a link.
              </p>
              <div style={{ display: "flex", gap: 10, justifyContent: "center" }}>
                <button
                  onClick={onClose}
                  style={{
                    background: "var(--tl-brand-500)",
                    color: "#fff",
                    border: "none",
                    borderRadius: 8,
                    padding: "10px 24px",
                    fontSize: 14,
                    fontWeight: 600,
                    fontFamily: "var(--tl-font)",
                    cursor: "pointer"
                  }}
                >
                  Export PDF
                </button>
                <button
                  onClick={onClose}
                  style={{
                    background: "none",
                    color: "var(--tl-text-muted)",
                    border: "1px solid var(--tl-border)",
                    borderRadius: 8,
                    padding: "10px 24px",
                    fontSize: 14,
                    fontWeight: 600,
                    fontFamily: "var(--tl-font)",
                    cursor: "pointer"
                  }}
                >
                  Close
                </button>
              </div>
            </div>
          </div>
        );
      }

      /* ── MAIN APP ─────────────────────────────────────────────── */
      function App() {
        const [issues, setIssues] = useState(
          INITIAL_ISSUES.map(i => ({ ...i }))
        );
        const [showSaveModal, setShowSaveModal] = useState(false);

        const BASE_SCORE = 72;
        const handledCount = issues.filter(i => i.status === "done" || i.status === "applied").length;
        // Each issue resolved boosts score by ~7-9 points depending on severity
        const scoreGain = issues.reduce((acc, i) => {
          if (i.status === "done" || i.status === "applied") {
            if (i.severity === "high") return acc + 12;
            if (i.severity === "medium") return acc + 9;
            return acc + 6;
          }
          return acc;
        }, 0);
        const score = Math.min(100, BASE_SCORE + scoreGain);
        const openIssues = issues.filter(i => i.status === "open");

        function handleApply(issueId) {
          setIssues(prev => prev.map(i =>
            i.id === issueId ? { ...i, status: "applied" } : i
          ));
        }

        function handleDone(issueId) {
          setIssues(prev => prev.map(i =>
            i.id === issueId ? { ...i, status: "done" } : i
          ));
        }

        return (
          <>
            <TopNav />

            <main style={{
              maxWidth: 1120,
              margin: "0 auto",
              padding: "24px 24px 80px",
              display: "flex",
              flexDirection: "column",
              gap: 0
            }}>
              {/* Page title */}
              <div style={{ marginBottom: 20 }}>
                <h1 style={{ fontSize: 20, fontWeight: 800, letterSpacing: "-0.4px", marginBottom: 2 }}>
                  Fix Workspace
                </h1>
                <p style={{ fontSize: 13, color: "var(--tl-text-muted)" }}>
                  Sarah Chen · Product Operations Manager · General Resume
                </p>
              </div>

              {/* Two-column layout */}
              <div style={{
                display: "flex",
                gap: 24,
                alignItems: "flex-start"
              }}>
                {/* Left column */}
                <div style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column", gap: 16 }}>
                  <ScoreSummaryCard
                    score={score}
                    total={issues.length}
                    handled={handledCount}
                  />

                  {/* Section label */}
                  <div style={{ marginTop: 4 }}>
                    <p style={{
                      fontSize: 10,
                      fontFamily: "var(--tl-mono)",
                      fontWeight: 600,
                      textTransform: "uppercase",
                      letterSpacing: "1px",
                      color: "var(--tl-n-400)",
                      marginBottom: 12
                    }}>
                      Priority Fixes
                    </p>
                    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                      {issues.map(issue => (
                        issue.status === "open" ? (
                          <IssueTaskCard
                            key={issue.id}
                            issue={issue}
                            onApply={handleApply}
                            onDone={handleDone}
                          />
                        ) : (
                          <div
                            key={issue.id}
                            style={{
                              background: "var(--tl-surface)",
                              border: "1px solid var(--tl-border)",
                              borderLeft: `4px solid var(--tl-low-500)`,
                              borderRadius: 12,
                              padding: "14px 20px",
                              display: "flex",
                              alignItems: "center",
                              gap: 12,
                              opacity: 0.7
                            }}
                          >
                            <div style={{
                              width: 26,
                              height: 26,
                              borderRadius: "50%",
                              background: "var(--tl-low-100)",
                              color: "var(--tl-low-500)",
                              display: "flex",
                              alignItems: "center",
                              justifyContent: "center",
                              fontSize: 13,
                              fontWeight: 700,
                              flexShrink: 0
                            }}>
                              ✓
                            </div>
                            <div>
                              <p style={{ fontSize: 13, fontWeight: 600, color: "var(--tl-text-muted)", textDecoration: "line-through" }}>
                                {issue.title}
                              </p>
                              <p style={{ fontSize: 11, color: "var(--tl-low-500)", marginTop: 2, fontWeight: 500 }}>
                                {issue.status === "applied" ? "Rewrite applied" : "Marked done"}
                              </p>
                            </div>
                          </div>
                        )
                      ))}
                    </div>
                  </div>

                  {/* All done state */}
                  {openIssues.length === 0 && (
                    <div style={{
                      background: "var(--tl-low-50)",
                      border: "1px solid var(--tl-low-100)",
                      borderRadius: 12,
                      padding: "20px 24px",
                      textAlign: "center"
                    }}>
                      <p style={{ fontSize: 16, fontWeight: 700, color: "var(--tl-low-500)", marginBottom: 4 }}>
                        All issues handled!
                      </p>
                      <p style={{ fontSize: 13, color: "var(--tl-text-muted)" }}>
                        Use the sidebar to save and export your updated resume.
                      </p>
                    </div>
                  )}
                </div>

                {/* Right sidebar */}
                <Sidebar
                  issues={issues}
                  score={score}
                  onSaveClick={() => setShowSaveModal(true)}
                />
              </div>
            </main>

            {/* Responsive styles */}
            <style>{`
              @media (max-width: 900px) {
                main > div:last-child {
                  flex-direction: column !important;
                }
                main > div:last-child > aside {
                  width: 100% !important;
                  order: -1;
                }
                main > div:last-child > aside > div:first-child {
                  position: static !important;
                }
              }
            `}</style>

            {showSaveModal && (
              <SaveConfirmation onClose={() => setShowSaveModal(false)} />
            )}
          </>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
